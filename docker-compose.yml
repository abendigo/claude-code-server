services:
  claude-code:
    image: ghcr.io/abendigo/claude-code-server:latest
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - WORKER_IMAGE=ghcr.io/abendigo/claude-code-server-worker:latest
      - TUNNEL_NAME=claude-code-server
      - IDLE_TIMEOUT_SECONDS=7200
    volumes:
      - dispatch-state:/var/lib/claude-code-dispatch
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.claude-ttyd.rule=Host(`claude.frustrated.blog`)"
      - "traefik.http.routers.claude-ttyd.entrypoints=websecure"
      - "traefik.http.routers.claude-ttyd.tls.certresolver=leresolver"
      - "traefik.http.routers.claude-ttyd.middlewares=authelia@docker"
      - "traefik.http.services.claude-ttyd.loadbalancer.server.port=7681"
    networks:
      - traefik_default

volumes:
  dispatch-state:

networks:
  traefik_default:
    external: true